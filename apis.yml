apis:
- aid: incus:incus-rest-api
  name: Incus REST API
  description: The Incus REST API is the canonical interface to the Incus container and virtual machine manager. All communication
    between Incus and its clients happens over HTTP, using TLS for remote access or a Unix socket for local access. The API
    covers the complete lifecycle of instances, images, networks, storage pools, projects, profiles, certificates, and cluster
    members, with support for asynchronous operations and WebSocket-based event streams.
  humanURL: https://linuxcontainers.org/incus/docs/main/rest-api/
