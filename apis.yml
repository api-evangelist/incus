aid: incus
name: Incus
description: Incus is a modern open source system container and virtual machine manager maintained by LinuxContainers.org
  as a community-led fork of Canonical's LXD. It provides a unified experience for running and managing system containers
  and VMs across single hosts and clusters, with image-based deployment, live migration, snapshots, projects, and a comprehensive
  RESTful API for automation and tooling integration.
