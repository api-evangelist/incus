        x-go-name: Name
    title: NetworkACLsPost used for creating an ACL.
    type: object
    x-go-package: github.com/lxc/incus/v7/shared/api
  NetworkACLPut:
    properties:
      config:
        description: ACL configuration map (refer to doc/network-acls.md)
        example:
          user.mykey: foo
