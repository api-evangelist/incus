      description:
        description: Description of the load balancer listen IP
        example: My public IP load balancer
        type: string
        x-go-name: Description
      ports:
        description: Port forwards (optional)
        items:
          $ref: '#/definitions/NetworkLoadBalancerPort'
        type: array
