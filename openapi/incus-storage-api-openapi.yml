      responses:
        '200':
          description: API endpoints
          schema:
            description: Sync response
            properties:
              metadata:
                description: List of storage bucket backups
                items:
                  $ref: '#/definitions/StorageBucketBackup'
                type: array
              status:
                description: Status description
                example: Success
                type: string
              status_code:
