      path: /1.0
      operations:
      - name: server-get
        method: GET
        description: Get the server environment and configuration
        inputParameters:
        - name: target
          in: query
          type: string
          description: Cluster member name
        - name: project
          in: query
          type: string
          description: Project name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: server-patch
        method: PATCH
        description: Partially update the server configuration
        inputParameters:
        - name: target
          in: query
          type: string
          description: Cluster member name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: server-put
